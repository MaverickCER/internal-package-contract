# internal-package-contract caller workflow. Runs the shared Changesets + npm OIDC
# trusted-publishing release flow on every push to main. Don't inline the release
# logic itself here -- it lives in the shared, centrally-maintained reusable workflow
# this calls; a fix or improvement there reaches every consumer without a per-repo
# edit. See
# https://github.com/MaverickCER/internal-package-contract/blob/main/.github/workflows/release-npm-changesets.yml
#
# Requires Changesets already set up in this repo (`npm run version` / `npm run
# release` scripts, `.changeset/config.json`) and this repo's own npm trusted
# publisher registered on npmjs.com -- neither is set up by `internal-package-contract
# init`. See the reusable workflow's own `roll-floating-major-tag` input doc comment
# (linked above) before your first release: it defaults to true (every consumer had a
# composite GitHub Action to version when this default was chosen), which pushes a
# floating `v1` git tag on every successful publish. A plain npm package with no
# action.yml doesn't want that tag -- uncomment the `with:` block below for one.
name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      # Enables npm's OIDC trusted publishing -- see the called workflow's own
      # comment. Required here too: GitHub caps the called workflow's effective
      # permissions at the intersection of what this caller grants and what it
      # itself declares.
      id-token: write
    uses: MaverickCER/internal-package-contract/.github/workflows/release-npm-changesets.yml@main
    # An npm-only package (no composite GitHub Action / action.yml to version) --
    # uncomment so a successful release doesn't push an unwanted floating v1 tag:
    # with:
    #   roll-floating-major-tag: false
