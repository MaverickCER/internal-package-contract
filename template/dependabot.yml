# Automated dependency and workflow-action update PRs.
#
# Every runtime-dependency vulnerability already surfaces through the contract's own
# `SecurityDeps` check, and the SHA-pinned actions across the workflows drift silently without
# something rewriting them. Dependabot rewrites a pinned action SHA *and* refreshes the `# vX.Y.Z`
# tag comment next to it, which is exactly the form `.github/workflows/*` already use.
#
# Dev-dependency PRs are grouped into one weekly PR to keep the noise down -- none of them reach
# consumers. The `internal-package-contract` pin is deliberately left to its own
# `dependency-pin-sync` workflow (it re-pins the reusable workflows in the same pull request).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
    ignore:
      - dependency-name: "internal-package-contract"
      # TypeScript 7 removes the compiler API (createSourceFile, createProgram, the checker) that tools such as
      # typescript-eslint, TypeDoc and API Extractor are built on; stay on 5.x/6.x until they support it.
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]
      # changesets/action v1 (used by the release workflow) targets Changesets CLI v2; CLI v3 needs the
      # action's v2. Move both together, then remove this rule.
      - dependency-name: "@changesets/cli"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
          - major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    ignore:
      # The commits Dependabot offers for changesets/action after v1 belong to the action's v2, which refuses
      # Changesets CLI v2 ("designed to work with Changesets CLI v3"). Move the action and the CLI together.
      - dependency-name: "changesets/action"
    groups:
      github-actions:
        patterns:
          - "*"
