# Keeps this repo's internal-package-contract pin current. PULLS: a daily check (or a manual run)
# re-resolves the pin from this repository, so no token that reads another repository is needed. The
# pull request it opens re-pins the workflow SHAs too, and GitHub does not let GITHUB_TOKEN push a
# change to .github/workflows/*, so that push needs the optional PIN_SYNC_TOKEN secret below (a
# fine-grained token with Contents, Pull requests and Workflows write); it expires like any token.
name: Sync internal-package-contract version

on:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: MaverickCER/internal-package-contract/.github/workflows/dependency-pin-sync.yml@{{ipcSha}} # {{ipcRef}}
    with:
      dependency-name: internal-package-contract
    secrets:
      # Optional. Without it the run uses GITHUB_TOKEN, which GitHub does not allow to change workflow files.
      PIN_SYNC_TOKEN: ${{ secrets.PIN_SYNC_TOKEN }}
