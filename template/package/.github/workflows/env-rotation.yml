# Opens one issue when a credential that ci/env.schema.ts describes is expiring or has expired.
# It closes the issue once nothing is due for rotation.
# A token is then rotated before the workflow that uses it stops working.
# Without ci/env.schema.ts there is nothing to report, and this workflow does nothing.
# Nothing about it is required.
name: Credential rotation

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rotation:
    name: Credentials due for rotation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - run: npm ci --ignore-scripts
      - run: npx --no-install internal-package-contract env --rotation-issue
        env:
          GH_TOKEN: ${{ github.token }}
