# Publishes this package's OpenSSF Scorecard result, which the README badge reads. The ScorecardWorkflow
# check requires it. Scorecard rejects a publishing workflow with top-level env or defaults and limits the
# job to a few trusted actions, so keep it as it is.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "23 4 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # The public Scorecard API keeps each check's score and a one-line reason. Uploading the SARIF puts
      # the per-check details (which workflow, which line) in code scanning, where a reviewer can read why.
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
