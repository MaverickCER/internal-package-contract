# internal-package-contract caller workflow. It runs the contract on every push to main and on every
# pull request. The contract lives in the reusable workflow this calls, pinned below by commit SHA.
# `dependency-pin-sync` moves that SHA with the devDependency, in a reviewed pull request.
#
# The default branch's ruleset should require two job ids before a merge. `contract` stands for the
# reusable `standard` run below. `required` fails unless every other job in this file finished with
# success (otherwise a skipped or cancelled job would count as passing). `init --github` writes both
# into the ruleset it creates. An older repository adds `required` to its ruleset by hand. Until it does, `BranchProtection`
# fails, only `contract` blocks a merge and the other jobs are advisory. Renaming either job id unprotects the branch.
name: Contract

on:
  pull_request:
  push:
    branches: [main]
  # A bot-opened pull request (the dependency-pin sync, the release PR) does not start CI by itself;
  # those workflows dispatch it on the PR's branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Plans the mutation shards, runs them in parallel, merges their reports, then runs every check once.
  # In CI the contract runs `--strict`: a check that could not run fails unless
  # .repo-contract/exceptions/environment.json records an exception. The report is the `contract-report`
  # artifact; a job summary over 1 MB is cut, with a note pointing there.
  standard:
    uses: MaverickCER/internal-package-contract/.github/workflows/contract.yml@{{ipcSha}} # {{ipcRef}}
    permissions:
      contents: read
      # CodeScanning reads this ref's code-scanning alerts with the workflow token.
      security-events: read
    secrets:
      # SecuritySocket scores the package on Socket.dev. Without a token it fails in CI unless an
      # environment record accepts that. Create a token at socket.dev (Settings > API Tokens,
      # `packages:list`), then add it under GitHub: Settings > Secrets and variables > Actions as
      # SOCKET_SECURITY_API_KEY. Locally, run `socket login`.
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}

  # GitHub names a called job "standard / contract". This bare job is the `contract` status check the
  # ruleset, BranchProtection and the release workflow look for. It passes only when the standard passed.
  contract:
    needs: standard
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - env:
          RESULT: ${{ needs.standard.result }}
        run: test "$RESULT" = success

  # A package `init` scaffolded declares `engines.node >=22`. In an existing package, set this job's
  # node-version to its engines floor. The contract above runs on 24, so this job tests the floor.
  node-floor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test

  # The development toolchain targets TypeScript 5 or 6, because typescript-eslint, typedoc and API
  # Extractor load the TypeScript compiler API. The native TypeScript 7 compiler does not ship it. So
  # TypeScript 7 gets its own job: the package's source must still type-check under it. `npx -p`
  # supplies the 7 binary; the package's own `typescript` stays what the code's type imports resolve
  # against. Delete this job if the package cannot yet.
  typescript-7:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - run: npm ci
      - run: npx --yes -p typescript@7 tsc --noEmit -p tsconfig.json

  # The one status check that stands for every job above except `contract`. GitHub treats a skipped or
  # cancelled required job as passing, and cannot name a matrix job as one context. So this job runs
  # `if: always()` and fails unless each job it needs finished `success`. Add every new job to `needs`;
  # the `ci-jobs-test` managed copy fails a package whose ci.yml has a job this list omits. It blocks a
  # merge only once the ruleset names `required` (see the top of this file).
  required:
    needs: [standard, node-floor, typescript-7]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Every gate job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: >-
          node -e "const needs = JSON.parse(process.env.NEEDS);
          const bad = Object.entries(needs).filter(([, n]) => n.result !== 'success');
          if (bad.length > 0) {
            console.error('::error::not green: ' + bad.map(([id, n]) => id + '=' + n.result).join(', '));
            process.exit(1);
          }"
