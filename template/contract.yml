# internal-package-contract caller workflow. Runs the contract on every push to main and on every
# pull request. Replace nothing: the standard lives in the shared package.
#
# Two job ids are meant to be the status checks the default branch's ruleset requires before a merge:
# `contract`, the standard itself, and `required`, which fails unless every other job in this file
# except `contract` finished with success (a skipped or cancelled job would otherwise count as passing). `init --github`
# writes both into the ruleset it creates. A repository that predates that must add `required` to its
# ruleset itself; until it does, only `contract` blocks a merge and the other jobs are advisory.
# Renaming either job id unprotects the branch.
name: Contract

on:
  pull_request:
  push:
    branches: [main]
  # A bot-opened pull request (the dependency-pin sync, the release PR) does not start CI by itself;
  # those workflows dispatch it on the PR's branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # CodeScanning reads this ref's code-scanning alerts with the workflow token.
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commitlint needs the base branch
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - run: npm ci
      # SecuritySocket scores the package on Socket.dev. Without a token it warns that the scan did not
      # run; a rejected token, a network error, a rate limit or a missing `socket` CLI fails. Create a token at socket.dev
      # (Settings > API Tokens, `packages:list`), then add it under GitHub: Settings > Secrets and
      # variables > Actions as SOCKET_SECURITY_API_KEY. Locally, run `socket login`.
      #
      # In CI the contract runs `--strict`: a check that could not run here and has no recorded
      # exception (.repo-contract/exceptions/environment.json) fails the job instead of passing yellow.
      #
      # `--scope auto` runs only what a pull request's changes can affect (a push to main and a release run
      # everything, and so does a pull request that touches a lockfile, a config or anything the analysis cannot place).
      - run: npm run contract -- --scope auto
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
      # The contract's own record of the run -- evidence.json (what each check executed), report.json
      # (the verdict, every result classified, per-check timing) and summary.md (also written to the
      # job summary above).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: contract-report
          path: reports/contract
          if-no-files-found: ignore
          retention-days: 30

  # The package declares `engines.node >=22`; the contract above runs on 24, so prove the declared
  # floor itself by building and testing on it.
  node-floor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test

  # The development toolchain targets TypeScript 5 or 6 (typescript-eslint, typedoc and API Extractor
  # load the TypeScript compiler API, which the native TypeScript 7 compiler does not ship), so
  # TypeScript 7 gets its own job: the package's source must still type-check under it. `npx -p`
  # supplies the 7 binary; the package's own `typescript` stays what the code's type imports resolve
  # against. Delete this job if the package cannot yet.
  typescript-7:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - run: npm ci
      - run: npx --yes -p typescript@7 tsc --noEmit -p tsconfig.json

  # The one status check that stands for every job above except `contract`. GitHub treats a skipped or
  # cancelled required job as passing and cannot name a matrix job as one context, so this job runs
  # `if: always()` and fails unless each job it needs finished `success`. Add every new job to `needs`;
  # the `ci-jobs-test` managed copy fails a package whose ci.yml has a job this list omits. It blocks a
  # merge only once the ruleset names `required` (see the top of this file).
  required:
    needs: [node-floor, typescript-7]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Every gate job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: >-
          node -e "const needs = JSON.parse(process.env.NEEDS);
          const bad = Object.entries(needs).filter(([, n]) => n.result !== 'success');
          if (bad.length > 0) {
            console.error('::error::not green: ' + bad.map(([id, n]) => id + '=' + n.result).join(', '));
            process.exit(1);
          }"
