# Automated dependency and workflow-action update PRs.
#
# Every runtime-dependency vulnerability already surfaces through the contract's own
# `SecurityDeps` check, and the SHA-pinned actions across the workflows drift silently without
# something rewriting them. Dependabot rewrites a pinned action SHA *and* refreshes the `# vX.Y.Z`
# tag comment next to it, which is exactly the form `.github/workflows/*` already use.
#
# Dev-dependency PRs are grouped into one weekly PR to keep the noise down -- none of them reach
# consumers. The `internal-package-contract` pin is deliberately left to its own
# `dependency-pin-sync` workflow (it re-pins the reusable workflows in the same pull request).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
    ignore:
      - dependency-name: "internal-package-contract"
      # TypeScript 7 has no compiler API. The packages' build entries use the consumer's TypeScript when it is 5 or 6
      # and a bundled TypeScript 6 otherwise, and the tooling this standard runs (typescript-eslint, TypeDoc, API
      # Extractor) is built on that API, so the development toolchain stays on 6; 7 is type-checked in CI.
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
          - major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    ignore:
      # The release workflows pin changesets/action v1, which runs this standard's Changesets CLI 3 (see the 0.14.0
      # changelog). The action's v2 is a deliberate migration, not a Dependabot bump: move it by hand and test a release.
      - dependency-name: "changesets/action"
    groups:
      github-actions:
        patterns:
          - "*"
