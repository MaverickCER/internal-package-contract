# Reusable workflow: check for a newer pin, bump it, open a PR, and merge it if CI is green.
# Two kinds of caller share it:
#   - sync-repo-contract-version.yml (repo-contract -> internal-package-contract) always adds a
#     changeset whose severity follows the version change, because the engine coupling is real.
#   - each consumer's sync-internal-package-contract.yml (internal-package-contract -> a dependent)
#     never adds one: a tooling devDependency bump alone does not change what the consumer publishes.
#
# PULL, not push: each caller runs this daily (and on demand) in its own repository. Reading the
# dependency's newest release needs no token, so no token for another repository exists to expire.
# The optional PIN_SYNC_TOKEN is the caller's own token, for pushing workflow files in its own repository.
# It opens nothing when the pin is already current, and no second PR for a bump that already has one.
# A git dependency moves to the newest release tag. Every workflow in the calling repository that pins one
# of the dependency's reusable workflows by commit SHA is re-pinned in the same pull request.
#
# `on: workflow_call` only: see release-npm-changesets.yml's own identical note.
name: Dependency pin sync (reusable)

on:
  workflow_call:
    inputs:
      dependency-name:
        description: The npm package whose pin is being bumped (also its devDependency/dependency key in package.json).
        required: true
        type: string
      new-version:
        description: >-
          The version to bump an npm dependency to. Optional: left empty, the latest published
          version is used. Ignored for a git dependency, which moves to its newest release tag.
        required: false
        type: string
        default: ""
      add-changeset:
        description: >-
          Whether to also add a changeset bumping the CALLING repo's own version. Only correct when
          dependency-name is a real functional dependency of the caller, not just a devDependency
          version tick.
        required: false
        type: boolean
        default: false
      bump-type:
        description: >-
          major/minor/patch for the generated changeset. Optional: left empty, it follows the size of
          the version change (major, then minor, otherwise patch).
        required: false
        type: string
        default: ""
    secrets:
      PIN_SYNC_TOKEN:
        description: >-
          Optional. A token that can push workflow files and start CI on the pull request. Its permissions
          and refresh steps are in
          https://github.com/MaverickCER/internal-package-contract/blob/main/docs/ENVIRONMENT.md#ci-secrets-pin_sync_token.
          Without it the run uses GITHUB_TOKEN, which cannot change `.github/workflows/*` or start CI.
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.PIN_SYNC_TOKEN || github.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Bump the pin, preserving its existing range operator
        id: bump
        env:
          DEP: ${{ inputs.dependency-name }}
          NEW_VERSION: ${{ inputs.new-version }}
        run: |
          CURRENT=$(node -p "(require('./package.json').dependencies||{})[process.env.DEP] || (require('./package.json').devDependencies||{})[process.env.DEP] || ''")
          export CURRENT
          OLD=$(node -p "((require('./package-lock.json').packages||{})['node_modules/' + process.env.DEP]||{}).version||''")
          case "$CURRENT" in
            # A git dependency: internal-package-contract is consumed as `github:owner/repo#<tag>` and
            # is not on npm, so `name@version` cannot resolve. Move it to the newest release TAG
            # (`vX.Y.Z`), never to a branch head; an unreleased commit is not a version.
            github:*)
              REPO_SLUG="${CURRENT#github:}"
              REPO_SLUG="${REPO_SLUG%%#*}"
              LATEST_TAG=$(git ls-remote --tags --refs --sort=-v:refname "https://github.com/${REPO_SLUG}.git" 'v[0-9]*' | head -n 1 | sed 's#.*refs/tags/##')
              if [ -z "$LATEST_TAG" ]; then
                echo "::error::${REPO_SLUG} has no vX.Y.Z release tag to pin ${DEP} to."
                exit 1
              fi
              npm ci --ignore-scripts
              if [ -f "node_modules/${DEP}/scripts/upgrade/run.mjs" ]; then
                # The installed release updates everything the new one owns: the pin, the
                # workflows, the managed files and the generated documents. `git add -A` below
                # commits all of it.
                node "node_modules/${DEP}/bin/contract.mjs" upgrade "${LATEST_TAG}"
              else
                npm install --save-dev --ignore-scripts "${DEP}@github:${REPO_SLUG}#${LATEST_TAG}"
              fi
              TARGET="${LATEST_TAG}"
              ;;
            git+*|git@*|https://*|ssh://*)
              npm update --ignore-scripts "${DEP}"
              TARGET=$(node -p "(((require('./package-lock.json').packages||{})['node_modules/' + process.env.DEP]||{}).resolved||'').split('#')[1]||''" | cut -c1-7)
              ;;
            *)
              LATEST="${NEW_VERSION:-$(npm view "$DEP" version)}"
              PREFIX=$(node -p "(process.env.CURRENT.match(/^[\^~]/) || [''])[0]" )
              # `npm install dep@x.y.z` saves `^x.y.z` by default, which would silently turn an exact
              # pin into a range: keep exactly the operator the pin already had.
              if [ -z "$PREFIX" ]; then
                npm install --ignore-scripts --save-exact "${DEP}@${LATEST}"
              else
                npm install --ignore-scripts --save-prefix="${PREFIX}" "${DEP}@${LATEST}"
              fi
              TARGET="$LATEST"
              ;;
          esac
          # A workflow that calls one of the dependency's reusable workflows pins it by commit SHA,
          # with the release tag in a trailing comment. Move those pins together with the dependency,
          # so the workflow code never drifts from the installed version.
          NEW_SHA=$(node -p "(((require('./package-lock.json').packages||{})['node_modules/' + process.env.DEP]||{}).resolved||'').split('#')[1]||''")
          if [ -n "$NEW_SHA" ] && [ -d .github/workflows ]; then
            node node_modules/internal-package-contract/scripts/repin-workflows.mjs "$DEP" "$NEW_SHA" "$TARGET"
          fi
          if [ -z "$(git status --porcelain)" ]; then
            echo "${DEP} is already current (${TARGET}); nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"
          echo "old=${OLD}" >> "$GITHUB_OUTPUT"

      - name: Generate a changeset for this repo's own version
        if: ${{ inputs.add-changeset && steps.bump.outputs.changed == 'true' }}
        env:
          DEP: ${{ inputs.dependency-name }}
          TARGET: ${{ steps.bump.outputs.target }}
          OLD: ${{ steps.bump.outputs.old }}
          BUMP: ${{ inputs.bump-type }}
        run: |
          if [ -z "$BUMP" ]; then
            BUMP=$(node -e '
              const [oa, ob] = process.env.OLD.split(".").map(Number)
              const [na, nb] = process.env.TARGET.split(".").map(Number)
              console.log(na !== oa ? "major" : nb !== ob ? "minor" : "patch")
            ')
          fi
          PKG=$(node -p "require('./package.json').name")
          mkdir -p .changeset
          cat > ".changeset/sync-${DEP}-${TARGET}.md" <<EOF
          ---
          "$PKG": $BUMP
          ---

          Bump \`$DEP\` to $TARGET.
          EOF

      - name: Commit and open a PR
        id: pr
        if: ${{ steps.bump.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.PIN_SYNC_TOKEN || github.token }}
          DEP: ${{ inputs.dependency-name }}
          TARGET: ${{ steps.bump.outputs.target }}
        run: |
          BRANCH="chore/bump-${DEP}-${TARGET}"
          # "Already open" means an OPEN pull request, not merely that the branch still exists. A pull
          # request closed without merging leaves its branch behind.
          OPEN=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$OPEN" != "0" ]; then
            echo "A bump to ${TARGET} is already open on ${BRANCH}; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git checkout -b "$BRANCH"
          git commit -m "chore(deps): bump ${DEP} to ${TARGET}"
          # --force: the branch is this bot's own. A stale one, left by a pull request closed without
          # merging, must not block every later bump to the same target.
          git push --force origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(deps): bump ${DEP} to ${TARGET}" \
            --body "Automated dependency-pin sync: ${DEP} is now ${TARGET}."
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # Same dispatch-and-poll shape as release-npm-changesets.yml's merge step, with one difference.
      # A red run here leaves the PR open for a human instead of failing the job. A real dependency
      # bump, unlike a generated version bump, can surface a failure that a person should look at.
      # That holds when add-changeset is true too, since the engine coupling can break the same way.
      - name: Dispatch CI, then merge only if it comes back green
        if: steps.pr.outputs.branch
        env:
          GH_TOKEN: ${{ secrets.PIN_SYNC_TOKEN || github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          SHA=$(git rev-parse HEAD)
          # The three packages name their workflow ci.yml; a package scaffolded by `init` names it contract.yml.
          WORKFLOW=ci.yml
          [ -f .github/workflows/ci.yml ] || WORKFLOW=contract.yml
          gh workflow run "$WORKFLOW" --ref "$BRANCH"
          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID=$(gh run list --workflow="$WORKFLOW" --branch "$BRANCH" --json databaseId,headSha \
              --jq "[.[] | select(.headSha == \"$SHA\")][0].databaseId")
            [ -n "$RUN_ID" ] && break
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then
            echo "::warning::Never saw the dispatched $WORKFLOW run start for $SHA; leaving PR open for a human."
            exit 0
          fi
          if gh run watch "$RUN_ID" --exit-status; then
            PR_NUMBER=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
            gh pr merge "$PR_NUMBER" --squash --delete-branch
          else
            echo "::warning::CI failed on the dependency-bump branch; leaving PR open for a human, not force-merging."
          fi
