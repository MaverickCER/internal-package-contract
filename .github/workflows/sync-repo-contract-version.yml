# Keeps this repo's `repo-contract` devDependency pin -- a real functional/engine coupling, not just a
# version tick -- in sync automatically. PULLS: a daily check (or a manual run) compares against the
# latest published repo-contract using this repo's own GITHUB_TOKEN, so no cross-repository token
# exists to expire. See dependency-pin-sync.yml for the bump/PR/merge mechanics this calls into.
name: Sync repo-contract version

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/dependency-pin-sync.yml
    with:
      dependency-name: repo-contract
      add-changeset: true
