# Listens for repo-contract's own release (part E of the "Standardize npm release +
# Pages deploy" plan) and keeps this repo's `repo-contract` devDependency pin -- a
# real functional/engine coupling, not just a version tick -- in sync automatically.
# See dependency-pin-sync.yml for the actual bump/PR/merge mechanics this calls into.
name: Sync repo-contract version

on:
  repository_dispatch:
    types: [repo-contract-released]

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/dependency-pin-sync.yml
    with:
      dependency-name: repo-contract
      new-version: ${{ github.event.client_payload.version }}
      add-changeset: true
      bump-type: ${{ github.event.client_payload.bump-type }}
