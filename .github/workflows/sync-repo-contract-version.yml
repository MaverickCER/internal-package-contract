# Keeps this repo's `repo-contract` devDependency pin current; the engine coupling is real, not a
# version tick. PULLS: a daily check (or a manual run) compares against the latest published
# repo-contract with this repo's own GITHUB_TOKEN. No cross-repository token exists to expire.
# See dependency-pin-sync.yml for the bump, PR and merge steps this calls.
name: Sync repo-contract version

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/dependency-pin-sync.yml
    with:
      dependency-name: repo-contract
      add-changeset: true
