# Reusable workflow that regenerates the committed API and surface baselines on the release pull request
# branch and pushes them there. The usual route is the `version` script, which runs `update-baseline` after
# the build so the release commit carries the baselines (README, "Release"). This workflow is for a
# package whose `version` script cannot build. A baseline that records another version than package.json
# fails ApiContract and SurfaceContract, so a release that skipped both routes fails its own pull request.
#
# `on: workflow_call` only: see release-npm-changesets.yml's own identical note.
name: API baseline sync (reusable)

on:
  workflow_call: {}

concurrency:
  # Serialize runs for the same Release PR branch: this job pushes a commit back
  # onto that branch. Two overlapping runs (a fast `synchronize` after the push,
  # say) would race to regenerate and push the baseline. `cancel-in-progress`
  # is deliberately false: a run must not be interrupted mid-`git push`.
  group: api-baseline-sync-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  update-baseline:
    # Changesets' own fixed branch name for a single-package repo's Version
    # Packages PR (see each consumer's own .changeset/config.json baseBranch: main).
    if: github.head_ref == 'changeset-release/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: npm ci
      - run: npm run build
      # Idempotent: a no-op (exit 0, no file writes) once every target's baseline
      # already carries package.json's version. See update-baseline.ts.
      - run: npx internal-package-contract update-baseline

      - name: Commit the regenerated baseline
        env:
          # Passed through the environment rather than interpolated straight into
          # `run`. A branch ref is attacker-influenced input, so it must never be
          # part of the shell command text.
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .repo-contract/api-contract .repo-contract/surface-contract
          if git diff --cached --quiet -- .repo-contract/api-contract .repo-contract/surface-contract; then
            echo "Baseline already current; nothing to commit."
            exit 0
          fi
          git commit -m "chore: sync generated API and surface baselines for release"
          git push origin HEAD:"$HEAD_REF"
