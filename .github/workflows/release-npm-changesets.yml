# Reusable release workflow for internal-package-contract consumers using Changesets +
# npm OIDC trusted publishing. It replaces the release logic each consumer's own
# .github/workflows/release.yml (env-cap, data-cap, ...) once copied verbatim.
# template/release.yml is the thin per-repo caller `internal-package-contract init` scaffolds.
# A change here reaches a consumer only when it bumps the commit SHA it pins this workflow at.
# dependency-pin-sync.yml moves that SHA together with the devDependency pin.
#
# `on: workflow_call` (not `workflow_dispatch`/`push`) is what makes this reusable. It has no
# trigger of its own: it runs only from a caller's own `uses:` job
# (https://docs.github.com/actions/using-workflows/reusing-workflows).
#
# THREE JOBS, so that nothing holding the npm publishing identity ever runs repository code:
#
#   version  contents/pull-requests/actions write, NO id-token. Generates changesets, opens or
#            updates the "chore: version packages" PR and dispatches CI on it. A person merges it;
#            nothing here does (a PR that crosses a major version is also flagged on the run).
#   build    contents read only. Installs with `--ignore-scripts`, so no dependency install script
#            runs. Runs the package's own `verify` gate and packs the tarball that will be published.
#   publish  id-token + contents write, but checks out nothing and installs nothing. It downloads the
#            tarball `build` made and publishes exactly that file with provenance. It creates the git
#            tags through the API. The only code it runs is a version-pinned npm.
name: Release (reusable)

on:
  workflow_call:
    inputs:
      roll-floating-major-tag:
        description: >-
          After a successful publish, move the floating `v<major>` git tag (`v0` while the package
          is 0.x, `v1` from 1.0.0, ...) to the release commit, for a consumer whose
          README/action.yml documents a `uses: owner/repo@v<major>`-style floating tag, e.g. a
          composite GitHub Action. The tag is named for the major of the version just published, so
          a 2.0.0 release creates `v2` and never moves `v1`. An npm-only consumer with no composite
          Action should pass false.
        type: boolean
        default: true
      npm-version:
        description: >-
          The exact npm CLI the publish job installs (OIDC trusted publishing needs >= 11.5.1). Pinned
          rather than `latest` because this job holds the publishing identity.
        type: string
        default: "11.21.0"
    outputs:
      version:
        description: The version just published by this run; empty if nothing was published.
        value: ${{ jobs.publish.outputs.version }}
      bump-type:
        description: >-
          major/minor/patch of the version just published, derived from the
          highest-severity changeset actually consumed to produce it. Empty if
          nothing was published.
        value: ${{ jobs.publish.outputs.bump-type }}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Dispatches the consumer's own ci.yml on the release PR's branch below. That step's
      # comment says why.
      actions: write
    outputs:
      has-changesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # changesets/action pushes with GITHUB_TOKEN itself; a credential left in .git/config
          # would be readable by every script the version step runs.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      # No dependency install script runs in a job that can write to the repository.
      - run: npm ci --ignore-scripts

      # Gives every feat, fix, perf or breaking commit since the last release a changeset. That is
      # either the hand-written one its own PR already added, or one generated here from its
      # Conventional Commit subject. Chore, ci, docs, test and bot commits never become a release,
      # even when they change what a user sees. Self-skips when HEAD is itself the
      # release commit. It runs from the consumer's own installed devDependency, so every consumer
      # shares one implementation.
      - name: Auto-generate changesets for any commit missing one
        run: node node_modules/internal-package-contract/scripts/generate-changeset-from-commits.mjs

      - name: Create or update the Release Pull Request
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: npm run version
          # changesets/action's own default commit/PR-title ("Version Packages") is not a
          # Conventional Commit. Every consumer's own `commits` check (bundled from
          # internal-package-contract) fails that bot commit on `origin/main..HEAD`; a real Release
          # PR confirmed it. `chore:` satisfies that check and is accurate: a version bump is a
          # chore, not a feature or fix.
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # changesets/action pushes the release-PR branch using the default GITHUB_TOKEN. GitHub never
      # lets that token trigger `push` or `pull_request` workflows, to prevent recursion. Without
      # this step the release PR sits with zero CI checks until a human pushes a real commit to it.
      # `gh workflow run` is exempt from that restriction. Its run's checks attach to the ref's head
      # SHA as a `pull_request` run's would. The release PR then shows its checks before a person merges it.
      - name: Dispatch the consumer's CI on the release PR's branch
        id: dispatch
        if: steps.changesets.outputs.pullRequestNumber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          BRANCH=$(gh pr view "$PR" --json headRefName -q .headRefName)
          SHA=$(gh pr view "$PR" --json headRefOid -q .headRefOid)
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # A convenience, not a gate: a repository whose ci.yml has no `workflow_dispatch` trigger
          # cannot be dispatched, and that must not fail the release job.
          gh workflow run ci.yml --ref "$BRANCH" || echo "::warning title=CI not dispatched::Could not dispatch ci.yml on $BRANCH. Give it a workflow_dispatch trigger, or push a commit to the release PR, so it shows checks before you merge it."

      # A person merges every release PR. One that crosses a major version (0.x -> 1.0.0,
      # 1.x -> 2.0.0) is also a decision about what the package promises, so this step flags it
      # on the run.
      - name: Detect a release that crosses a major version
        id: boundary
        if: steps.changesets.outputs.pullRequestNumber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.dispatch.outputs.branch }}
        run: |
          BASE_MAJOR=$(node -p "require('./package.json').version.split('.')[0]")
          NEXT=$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$BRANCH" --jq .content | base64 -d | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          if [ "${NEXT%%.*}" != "$BASE_MAJOR" ]; then
            echo "crosses=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Major release needs a human::This release PR bumps the major version to $NEXT. Merge it only if the package is ready to promise that."
          else
            echo "crosses=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    # Nothing left to version: HEAD is a release commit, or an ordinary push with no releasable
    # change. The version in package.json is either already on npm or about to be.
    if: needs.version.outputs.has-changesets != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The contract-run attestation below reads this repository's workflow runs and their jobs.
      actions: read
    outputs:
      should-publish: ${{ steps.info.outputs.should-publish }}
      name: ${{ steps.info.outputs.name }}
      version: ${{ steps.info.outputs.version }}
      bump-type: ${{ steps.info.outputs.bump-type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - run: npm ci --ignore-scripts

      - name: Is this version already on npm?
        id: info
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          PRIVATE=$(node -p "require('./package.json').private === true")
          # bump-type comes from `.changeset/.release-bump.json`. The auto-generation step wrote it
          # during the VERSION run that produced this exact version bump. Diffing version strings
          # would be ambiguous pre-1.0. The file rides along in the release commit.
          BUMP=$(node -p "require('./.changeset/.release-bump.json').bump" 2>/dev/null || echo "")
          {
            echo "name=$NAME"
            echo "version=$VERSION"
            echo "bump-type=$BUMP"
          } >> "$GITHUB_OUTPUT"
          if [ "$PRIVATE" = "true" ]; then
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
            echo "$NAME is private; nothing to publish."
          elif npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already on npm."
          else
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          fi

      # The gate that used to run as `prepublishOnly` inside the publishing job. Running it here, with
      # no credentials, keeps the same bar without handing the publishing identity to it.
      - name: Verify
        if: steps.info.outputs.should-publish == 'true'
        run: |
          if node -e "process.exit(require('./package.json').scripts?.verify ? 0 : 1)"; then
            npm run verify
          else
            npm run build --if-present
          fi

      # The contract is the gate, and it ran on the pull request. The repository's ruleset requires the
      # `contract` job before a merge and keeps the branch up to date. So the merged tree is the tree
      # that passed. This job does not run the contract again: it takes minutes to hours, and a sharded
      # mutation run cannot run in one job. Instead it proves that a workflow run finished its `contract`
      # job with success on a commit with exactly this tree. That commit is the release commit itself,
      # one of its parents, or the pull request it merged. A commit that reached the default branch past
      # the ruleset (an administrator's bypass) without that evidence is not published.
      - name: Require a passing contract run on this tree
        if: steps.info.outputs.should-publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Passes when `contract` succeeded and `required` either succeeded or is not in the run.
          GATES_JQ: >-
            [.jobs[] | select(.name == "contract" or .name == "required")] as $gates | ($gates | map(select(.name == "contract" and .conclusion == "success")) | length) as $c | ($gates | map(select(.name == "required")) | length) as $r | ($gates | map(select(.name == "required" and .conclusion == "success")) | length) as $ok | if $c > 0 and ($r == 0 or $ok > 0) then "pass" else "no" end
        run: |
          set -eu
          repo="$GITHUB_REPOSITORY"
          tree=$(gh api "repos/$repo/commits/$GITHUB_SHA" --jq '.commit.tree.sha')
          candidates="$GITHUB_SHA $(gh api "repos/$repo/commits/$GITHUB_SHA" --jq '.parents[].sha' | tr '\n' ' ')"
          pr=$(gh api "repos/$repo/commits/$GITHUB_SHA/pulls" --jq '.[0].head.sha // empty' 2>/dev/null || true)
          candidates="$candidates $pr"
          for sha in $candidates; do
            [ -n "$sha" ] || continue
            [ "$(gh api "repos/$repo/commits/$sha" --jq '.commit.tree.sha')" = "$tree" ] || continue
            for run in $(gh api "repos/$repo/actions/runs?head_sha=$sha&per_page=50" --jq '.workflow_runs[].id'); do
              # `contract` must have passed, and so must `required` when the run has one. `required`
              # aggregates every other gate job (runtime, TypeScript, examples), so a merge past a red one
              # is not released.
              verdict=$(gh api "repos/$repo/actions/runs/$run/jobs?per_page=100" --jq "$GATES_JQ")
              if [ "$verdict" = "pass" ]; then
                echo "contract (and required, where the run has it) passed in run $run on $sha (same tree as $GITHUB_SHA)"
                exit 0
              fi
            done
          done
          echo "::error title=No passing contract run::No workflow run on a commit with this tree finished its \`contract\` job (and its \`required\` job, where it has one) with success. The release commit never passed its own contract; merge it through a pull request whose contract check is green."
          exit 1

      # A released package must not ship a document that still asks its author a question. The same check
      # only warns during development; `IPC_RELEASE=1` is what turns it into a failure.
      - name: Check that no prompt is left unanswered
        if: steps.info.outputs.should-publish == 'true'
        env:
          IPC_RELEASE: "1"
        run: npx internal-package-contract --checks PromptBlocks

      - name: Pack the tarball to publish
        if: steps.info.outputs.should-publish == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release"
          ls -l "$RUNNER_TEMP/release"

      # Source-level tests run the source. This step installs the exact tarball about to be published
      # into an empty project and imports every entry point, as a consumer would. It runs before the
      # upload, so nothing that fails here can reach the publish job.
      - name: Install the tarball into a clean project and import it
        if: steps.info.outputs.should-publish == 'true'
        run: |
          set -eu
          set -- "$RUNNER_TEMP"/release/*.tgz
          [ "$#" -eq 1 ] || { echo "::error::Expected exactly one tarball, found $#."; exit 1; }
          node node_modules/internal-package-contract/scripts/check-packed-consumer.mjs --strict --tarball "$1"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.info.outputs.should-publish == 'true'
        with:
          name: release-tarball
          path: ${{ runner.temp }}/release/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    # Only the default branch publishes. The caller triggers on pushes to it, so this holds already.
    # It is stated here so a caller edited to run on another branch cannot publish from it.
    if: needs.build.outputs.should-publish == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      # Enables npm's OIDC trusted publishing (GA since July 2025): no NPM_TOKEN
      # secret exists or is needed. npm checks this exact workflow and repository against a
      # trusted-publisher registration made once, by hand, on npmjs.com. The caller workflow's
      # own job must grant this same permission. GitHub caps a called workflow's permissions at
      # what both the caller and this file grant.
      id-token: write
      # Creates the release tag, moves the floating major tag through the API, and creates the GitHub Release.
      contents: write
    outputs:
      version: ${{ needs.build.outputs.version }}
      bump-type: ${{ needs.build.outputs.bump-type }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
          path: ${{ runner.temp }}/release

      # Pinned, not `latest`: this job holds the publishing identity.
      - name: Install the pinned npm
        env:
          NPM_VERSION: ${{ inputs.npm-version }}
        run: npm install -g "npm@$NPM_VERSION"

      - name: Publish exactly the tarball the build job made
        run: |
          set -eu
          set -- "$RUNNER_TEMP"/release/*.tgz
          [ "$#" -eq 1 ] || { echo "::error::Expected exactly one tarball, found $#."; exit 1; }
          npm publish "$1" --provenance --access public --ignore-scripts

      - name: Tag the release, and move the floating major tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          ROLL: ${{ inputs.roll-floating-major-tag }}
        run: |
          set -eu
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA" > /dev/null
          if [ "$ROLL" = "true" ]; then
            # Named for the major of the version just published. A 2.0.0 release creates `v2` and
            # never moves `v1`. While the package is 0.x the tag is `v0`. `@v1` only ever points at a
            # 1.x release.
            MAJOR_TAG="v${VERSION%%.*}"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$MAJOR_TAG" > /dev/null 2>&1; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$MAJOR_TAG" \
                -f sha="$GITHUB_SHA" -F force=true > /dev/null
            else
              gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$MAJOR_TAG" -f sha="$GITHUB_SHA" > /dev/null
            fi
          fi

      # The GitHub Releases page is the first place many people look for what shipped, so each version
      # gets a Release for the tag just created. The notes are that version's section of the CHANGELOG in
      # the published tarball. This job holds the publishing identity, so the tarball is read as data and
      # no code from it runs. A package that ships no CHANGELOG gets GitHub's generated notes instead.
      # Safe to re-run: a Release that already exists is left alone. A failure here is shown on the step but
      # must not skip the npm verification that follows, which stays the last thing this job does.
      - name: Create the GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job has no checkout, so `gh release` cannot infer the repository from a git remote
          # ("not a git repository"); GH_REPO names it. Without it every release from 0.13.3 on skipped
          # its GitHub Release, hidden by continue-on-error.
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists."
            exit 0
          fi
          set -- "$RUNNER_TEMP"/release/*.tgz
          [ "$#" -eq 1 ] || { echo "::error::Expected exactly one tarball, found $#."; exit 1; }
          notes="$RUNNER_TEMP/release-notes.md"
          tar -xzOf "$1" package/CHANGELOG.md 2> /dev/null \
            | awk -v heading="## $VERSION" '$0 == heading { found = 1; next } found && /^## / { exit } found' \
            > "$notes" || true
          if [ -s "$notes" ]; then
            gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$notes"
          else
            gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes
          fi

      # Publishing succeeded as far as npm's client knows; this asks the registry what it now serves. A
      # failure cannot unpublish anything; it makes the run red so a person looks. The version must be
      # there, with the provenance attestation that proves this repository's CI built it.
      - name: Verify what npm now serves
        env:
          NAME: ${{ needs.build.outputs.name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          # --prefer-online: `npm view` otherwise answers from npm's own cache. That cache can hold the
          # package document from before the publish and report the new version missing for minutes. Each
          # query is bounded (20 s, no retries; npm's own default waits five minutes). The loop stops at a
          # ten-minute deadline, so a registry that hangs cannot hold the job past it.
          served=""
          deadline=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            served=$(npm view "$NAME@$VERSION" version --prefer-online --fetch-timeout=20000 --fetch-retries=0 2>/dev/null || true)
            [ "$served" = "$VERSION" ] && break
            sleep 15
          done
          if [ "$served" != "$VERSION" ]; then
            echo "::error::npm does not serve $NAME@$VERSION ten minutes after publishing it."
            exit 1
          fi
          attestations=$(npm view "$NAME@$VERSION" dist.attestations --json --prefer-online --fetch-timeout=20000 2>/dev/null || true)
          if [ -z "$attestations" ] || [ "$attestations" = "undefined" ] || [ "$attestations" = "null" ]; then
            echo "::error::$NAME@$VERSION is on npm but carries no provenance attestation."
            exit 1
          fi
          echo "$NAME@$VERSION is served by npm with a provenance attestation."
