# CI for internal-package-contract itself: runs its own self-hosting contract
# (repo-contract.config.ts, via `npm run contract` -> scripts/run-contract.mjs)
# -- this package governing itself using itself, the same way a consumer
# (env-cap, data-cap, ...) runs `npm run contract` in their own CI. See
# template/contract.yml for the workflow `internal-package-contract init`
# writes into a consuming package.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run contract
