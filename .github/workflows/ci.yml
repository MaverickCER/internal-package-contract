# CI for internal-package-contract itself: runs its own self-hosting contract
# (repo-contract.config.ts, via `npm run contract` -> scripts/run-contract.mjs)
# -- this package governing itself using itself, the same way a consumer
# (env-cap, data-cap, ...) runs `npm run contract` in their own CI. See
# template/contract.yml for the workflow `internal-package-contract init`
# writes into a consuming package.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A pull request opened by a workflow's own GITHUB_TOKEN (the dependency-pin sync, the release PR)
  # does not start CI by itself, so those workflows dispatch it on the PR's branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm run contract
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: contract-report
          path: reports/contract
          if-no-files-found: ignore
          retention-days: 30

  # bin/init.mjs does path/file-I/O and git-hook wiring -- verify it (and the
  # unit suite) actually work on Windows, not just macOS/Linux. Not the full
  # `npm run contract` here: Mutation/Accessibility need Stryker/a system
  # Chrome, well beyond what a cross-platform path-handling smoke test needs.
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: init.mjs smoke test in a scratch consumer
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/scratch-consumer"
          cd "$RUNNER_TEMP/scratch-consumer"
          git init -q
          git remote add origin https://github.com/MaverickCER/scratch.git
          printf '{"name":"scratch","version":"0.0.0"}' > package.json
          node "$GITHUB_WORKSPACE/bin/init.mjs"
          test -f .gitignore
          test -f CODEOWNERS
          test -f SECURITY.md
          test -f CONTRIBUTING.md
