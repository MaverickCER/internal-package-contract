# CI for internal-package-contract itself. It runs the package's own contract
# (repo-contract.config.ts, via `npm run contract` -> scripts/run-contract.mjs).
# A consumer such as env-cap or data-cap runs `npm run contract` the same way.
# template/contract.yml is the workflow `internal-package-contract init`
# writes into a consuming package.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A pull request a workflow opens may not start CI, or GitHub may hold the run for approval. The
  # consumers' dependency-pin sync and release workflows dispatch CI on the PR's branch. On this
  # repository's own Version Packages pull request GitHub holds the run until a person approves it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - run: npm ci
      # A pull request runs what its changes can affect; a push to main and a release run everything.
      - run: npm run contract -- --scope auto
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: contract-report
          path: reports/contract
          if-no-files-found: ignore
          retention-days: 30

  # Transitional: the default branch's ruleset still lists `self-check` as a required status check.
  # That was this job's name before it became the standard `contract`. This job passes exactly when
  # `contract` does, so nothing is weakened. Delete it together with the ruleset's `self-check` entry.
  self-check:
    needs: contract
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.contract.result }}" = "success"

  # The development toolchain stays on TypeScript 6, the last line with the classic compiler API.
  # Both typescript-eslint and API Extractor load that API; the native TypeScript 7 compiler has none.
  # So TypeScript 7 gets its own job: this repository's source must still type-check under it. `npx -p`
  # supplies the 7 binary. The repository's own `typescript` stays what the code's type imports resolve
  # against.
  typescript-7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - run: npm ci
      - run: npx --yes -p typescript@7 tsc --noEmit -p tsconfig.self.json

  # bin/scaffold.mjs does path and file I/O and wires git hooks. This job proves it
  # and the unit suite work on Windows, not only on macOS and Linux. It skips the full
  # `npm run contract`: Mutation needs Stryker and Accessibility a system Chrome,
  # well beyond what a cross-platform path-handling smoke test needs.
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: scaffold.mjs smoke test in a scratch consumer
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/scratch-consumer"
          cd "$RUNNER_TEMP/scratch-consumer"
          git init -q
          git remote add origin https://github.com/MaverickCER/scratch.git
          printf '{"name":"scratch","version":"0.0.0"}' > package.json
          node "$GITHUB_WORKSPACE/bin/scaffold.mjs"
          test -f .gitignore
          test -f CODEOWNERS
          test -f SECURITY.md
          test -f CONTRIBUTING.md
