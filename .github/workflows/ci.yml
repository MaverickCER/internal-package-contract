# CI for internal-package-contract itself: runs its own self-hosting contract
# (repo-contract.config.ts, via `npm run contract` -> scripts/run-contract.mjs)
# -- this package governing itself using itself, the same way a consumer
# (env-cap, data-cap, ...) runs `npm run contract` in their own CI. See
# template/contract.yml for the workflow `internal-package-contract init`
# writes into a consuming package.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A pull request opened by a workflow's own GITHUB_TOKEN (the dependency-pin sync, the release PR)
  # does not start CI by itself, so those workflows dispatch it on the PR's branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm run contract
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: contract-report
          path: reports/contract
          if-no-files-found: ignore
          retention-days: 30

  # Transitional: the default branch's ruleset still lists `self-check` as a required status check, the
  # name this job had before it became the standard `contract`. This job passes exactly when `contract`
  # does, so nothing is weakened; delete it together with the ruleset's `self-check` entry.
  self-check:
    needs: contract
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.contract.result }}" = "success"

  # The development toolchain stays on TypeScript 6, the last line that ships the classic compiler API
  # (typescript-eslint and API Extractor load it; the native TypeScript 7 compiler does not), so TypeScript 7
  # gets its own job: this repository's source must still type-check under it. `npx -p` supplies the 7
  # binary; the repository's own `typescript` stays what the code's type imports resolve against.
  typescript-7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - run: npm ci
      - run: npx --yes -p typescript@7 tsc --noEmit -p tsconfig.self.json

  # bin/init.mjs does path/file-I/O and git-hook wiring -- verify it (and the
  # unit suite) actually work on Windows, not just macOS/Linux. Not the full
  # `npm run contract` here: Mutation/Accessibility need Stryker/a system
  # Chrome, well beyond what a cross-platform path-handling smoke test needs.
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: init.mjs smoke test in a scratch consumer
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/scratch-consumer"
          cd "$RUNNER_TEMP/scratch-consumer"
          git init -q
          git remote add origin https://github.com/MaverickCER/scratch.git
          printf '{"name":"scratch","version":"0.0.0"}' > package.json
          node "$GITHUB_WORKSPACE/bin/init.mjs"
          test -f .gitignore
          test -f CODEOWNERS
          test -f SECURITY.md
          test -f CONTRIBUTING.md
