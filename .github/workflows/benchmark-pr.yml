# Reusable "measure benchmarks -> post/update a PR comment -> conditionally commit refreshed
# results+history" workflow for every package that benchmarks itself with the shared kit
# (`internal-package-contract/benchmark`, run through `run-suite.mjs`). It makes no assumption about
# how many suites a package has or what they are called: the caller lists them in `suites`, one
# `label|directory|history-file` per line, and the workflow measures, summarizes and records each.
#
# `on: workflow_call` only -- a caller's own `ci.yml` job decides *when* this runs; this file only
# defines *what* runs (see release-npm-changesets.yml's identical note).
#
# Example caller (data-cap):
#
#   benchmark-pr:
#     permissions: { contents: write, pull-requests: write, statuses: write }
#     uses: MaverickCER/internal-package-contract/.github/workflows/benchmark-pr.yml@<sha>
#     with:
#       suites: |
#         Runtime|benchmarks/performance-runtime|benchmarks/history/runtime.json
#         Build-time|benchmarks/performance-buildtime|benchmarks/history/buildtime.json
#       install-dirs: |
#         benchmarks/performance-runtime
#         benchmarks/performance-buildtime
#       budgets-path: benchmarks/budgets.mjs
#       comment-marker: "<!-- data-cap-benchmark-summary -->"
name: Benchmark PR (reusable)

on:
  workflow_call:
    inputs:
      suites:
        description: >-
          One suite per line, `label|directory|history-file`: the label shown in the PR comment, the
          directory holding the suite's results.json and BENCHMARKS.md, and the committed history
          file results are appended to.
        required: true
        type: string
      install-dirs:
        description: >-
          Directories (one per line) that need their own `npm install` first -- suites that are
          self-contained npm projects with a `file:` dependency on the package. Empty for none.
        required: false
        type: string
        default: ""
      benchmark-command:
        description: Command that runs every suite and writes each directory's results.json and BENCHMARKS.md.
        required: false
        type: string
        default: npm run benchmark
      build-command:
        description: Command that builds the package before benchmarking (suites import its built output). Empty to skip.
        required: false
        type: string
        default: npm run build
      budgets-path:
        description: Path to the package's benchmarks/budgets.mjs (BUDGETS export; a "*" entry is the default threshold).
        required: true
        type: string
      comment-marker:
        description: HTML comment marker identifying this PR's own summary comment, for update-in-place instead of a new comment each run.
        required: true
        type: string
      node-version:
        description: Node version for actions/setup-node.
        required: false
        type: string
        default: 22.x

jobs:
  # Same anti-recursion-loop shape as today's per-repo job -- see either
  # env-cap's or data-cap's own ci.yml for the incident this design avoids
  # (a GITHUB_TOKEN-authored push firing its own `pull_request: synchronize`
  # and re-triggering an unbounded remeasure loop). Preserved verbatim here:
  # same-repo PRs only, and `github.actor != 'github-actions[bot]'` breaks
  # the loop once this job's own commit becomes the new HEAD.
  benchmark-pr:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: benchmarks-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}

      - run: npm ci

      - name: Build the package
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          if [ -n "$BUILD_COMMAND" ]; then
            bash -c "$BUILD_COMMAND"
          fi

      - name: Install self-contained suite projects
        env:
          INSTALL_DIRS: ${{ inputs.install-dirs }}
        run: |
          printf '%s\n' "$INSTALL_DIRS" | while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            (cd "$dir" && npm install)
          done

      - name: Validate every suite's documentation
        run: npm run benchmark:check --if-present

      - name: Snapshot main's committed results as "previous"
        env:
          SUITES: ${{ inputs.suites }}
        run: |
          mkdir -p /tmp/benchmark-previous
          printf '%s\n' "$SUITES" | while IFS='|' read -r label dir _history; do
            [ -z "$label" ] && continue
            safe=$(printf '%s' "$dir" | tr '/' '_')
            git show "origin/main:${dir}/results.json" > "/tmp/benchmark-previous/${safe}.json" 2>/dev/null || echo '{}' > "/tmp/benchmark-previous/${safe}.json"
          done

      - name: Run the benchmarks
        env:
          BENCHMARK_COMMAND: ${{ inputs.benchmark-command }}
        run: bash -c "$BENCHMARK_COMMAND"

      - name: Collect result files for upload
        env:
          SUITES: ${{ inputs.suites }}
        run: |
          mkdir -p /tmp/benchmark-artifacts
          printf '%s\n' "$SUITES" | while IFS='|' read -r label dir _history; do
            [ -z "$label" ] && continue
            safe=$(printf '%s' "$dir" | tr '/' '_')
            cp "${dir}/results.json" "/tmp/benchmark-artifacts/${safe}.results.json"
            cp "${dir}/BENCHMARKS.md" "/tmp/benchmark-artifacts/${safe}.BENCHMARKS.md"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results
          path: /tmp/benchmark-artifacts
          retention-days: 14

      - name: Post or update the marker-tagged summary comment
        env:
          GH_TOKEN: ${{ github.token }}
          SUITES: ${{ inputs.suites }}
          BUDGETS_PATH: ${{ inputs.budgets-path }}
          COMMENT_MARKER: ${{ inputs.comment-marker }}
        run: |
          args=()
          while IFS='|' read -r label dir _history; do
            [ -z "$label" ] && continue
            safe=$(printf '%s' "$dir" | tr '/' '_')
            args+=(--example "${label} (\`${dir}\`)|/tmp/benchmark-previous/${safe}.json|${dir}/results.json|${history}")
          done <<< "$SUITES"
          node node_modules/internal-package-contract/scripts/benchmark/render-summary.mjs \
            --budgets "$BUDGETS_PATH" \
            --marker "$COMMENT_MARKER" \
            "${args[@]}" > /tmp/summary.md
          PR="${{ github.event.pull_request.number }}"
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" --jq ".[] | select(.body | startswith(\"$COMMENT_MARKER\")) | .id" | head -n1)
          if [ -n "$EXISTING" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${EXISTING}" -X PATCH -F body=@/tmp/summary.md
          else
            gh api "repos/${{ github.repository }}/issues/${PR}/comments" -X POST -F body=@/tmp/summary.md
          fi

      - name: Commit refreshed results + history into this PR, only when it touches benchmarked code
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through the environment rather than interpolated straight into `run` -- a branch
          # ref is attacker-influenced input and must never be spliced into the shell command text.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SUITES: ${{ inputs.suites }}
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD)
          dirs=()
          histories=()
          while IFS='|' read -r label dir history; do
            [ -z "$label" ] && continue
            dirs+=("$dir")
            histories+=("$history")
          done <<< "$SUITES"

          # Benchmarked code = src/ or anything under a suite directory, except the generated outputs.
          pattern="^src/"
          for dir in "${dirs[@]}"; do pattern="${pattern}|^${dir}/"; done
          RELEVANT=$(echo "$CHANGED" | grep -E "$pattern" | grep -vE "/(results\.json|BENCHMARKS\.md)$" | grep -vE "history/" || true)
          if [ -z "$RELEVANT" ]; then
            echo "This PR doesn't touch benchmarked code paths -- comment posted above, nothing to commit."
            exit 0
          fi

          for index in "${!dirs[@]}"; do
            node node_modules/internal-package-contract/scripts/benchmark/append-history.mjs \
              "${dirs[$index]}/results.json" "${histories[$index]}"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for index in "${!dirs[@]}"; do
            git add "${dirs[$index]}/results.json" "${dirs[$index]}/BENCHMARKS.md" "${histories[$index]}"
          done
          if git diff --cached --quiet; then
            echo "Freshly measured results match what's already committed -- nothing to push."
            exit 0
          fi
          git commit -m "chore(benchmarks): refresh results.json"
          git push origin HEAD:"$HEAD_REF"

# Pages deploy step (documented here, not wired up yet -- B2/B5's job):
#
# Each consumer's own `deploy` job in its ci.yml needs one step added before
# the Pages artifact upload:
#
#   - run: >-
#       node node_modules/internal-package-contract/scripts/benchmark/render-page.mjs
#       --out docs/benchmarks/index.html
#       --readme https://github.com/<owner>/<repo>/blob/main/benchmarks/README.md
#       --history 'Runtime|<history-file>'
#
# `docs/benchmarks/index.html` is generated fresh on every deploy and never
# committed -- the same treatment `docs/api/` (typedoc output) already gets
# in this fleet (see deploy-pages-typedoc.yml).
