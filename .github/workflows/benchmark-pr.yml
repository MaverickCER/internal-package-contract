# Reusable "measure benchmarks -> gate on same-run properties -> post/update a PR comment" workflow for
# every package that benchmarks itself with the shared kit (`internal-package-contract/benchmark`, run
# through `run-suite.mjs`). It makes no assumption about how many suites a package has or what they are
# called: the caller lists them in `suites`, one `label|directory|history-file` per line.
#
# It never writes to the pull request: its token can comment and nothing else, so the PR's head is
# exactly what its author pushed and CI ran on. Refreshing the committed results and history is a
# separate job that runs AFTER a merge, on the merge commit (benchmark-record.yml).
#
# What can fail the run is deliberately narrow (scripts/benchmark/gates.mjs): a function whose measured
# growth class differs from its documented big-O, and the package's overhead relative to its bare
# baseline growing past a threshold against the last run on main and the last release. Both are
# same-run quantities, so they survive the runner being a different machine than the one that produced
# the reference. Raw millisecond deltas are comments only.
#
# `on: workflow_call` only -- a caller's own `ci.yml` job decides *when* this runs; this file only
# defines *what* runs (see release-npm-changesets.yml's identical note).
#
# Example caller (data-cap):
#
#   benchmark-pr:
#     permissions: { contents: read, pull-requests: write }
#     uses: MaverickCER/internal-package-contract/.github/workflows/benchmark-pr.yml@<sha>
#     with:
#       suites: |
#         Runtime|benchmarks/performance-runtime|benchmarks/history/runtime.json
#         Build-time|benchmarks/performance-buildtime|benchmarks/history/buildtime.json
#       install-dirs: |
#         benchmarks/performance-runtime
#         benchmarks/performance-buildtime
#       budgets-path: benchmarks/budgets.mjs
#       comment-marker: "<!-- data-cap-benchmark-summary -->"
name: Benchmark PR (reusable)

on:
  workflow_call:
    inputs:
      suites:
        description: >-
          One suite per line, `label|directory|history-file`: the label shown in the PR comment, the
          directory holding the suite's results.json and BENCHMARKS.md, and the committed history
          file results are appended to after a merge.
        required: true
        type: string
      install-dirs:
        description: >-
          Directories (one per line) that need their own `npm install` first -- suites that are
          self-contained npm projects with a `file:` dependency on the package. Empty for none.
        required: false
        type: string
        default: ""
      benchmark-command:
        description: Command that runs every suite and writes each directory's results.json and BENCHMARKS.md.
        required: false
        type: string
        default: npm run benchmark
      build-command:
        description: Command that builds the package before benchmarking (suites import its built output). Empty to skip.
        required: false
        type: string
        default: npm run build
      budgets-path:
        description: Path to the package's benchmarks/budgets.mjs (BUDGETS export; a "*" entry is the default highlight threshold; an optional GATES export tunes the gates).
        required: true
        type: string
      comment-marker:
        description: HTML comment marker identifying this PR's own summary comment, for update-in-place instead of a new comment each run.
        required: true
        type: string
      node-version:
        description: >-
          Node version for actions/setup-node. Benchmarks should run on ONE Node version, the one the
          package's CI and results.json were produced on: a different engine changes every number.
        required: false
        type: string
        default: 24.x

jobs:
  benchmark-pr:
    # Same-repo pull requests only (a fork's code must not run with this job's token), and never a
    # bot's own pull request -- the benchmark-record job's results PR needs no benchmark comment.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: benchmarks-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the last release tag, and main's committed results
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}

      - run: npm ci --ignore-scripts

      - name: Build the package
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          if [ -n "$BUILD_COMMAND" ]; then
            bash -c "$BUILD_COMMAND"
          fi

      - name: Install self-contained suite projects
        env:
          INSTALL_DIRS: ${{ inputs.install-dirs }}
        run: |
          printf '%s\n' "$INSTALL_DIRS" | while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            (cd "$dir" && npm install --ignore-scripts)
          done

      - name: Validate every suite's documentation
        run: npm run benchmark:check --if-present

      # Two references for the same-run ratios: main's committed results (the previous run), and the
      # results committed at the last release (a fixed point, so a series of small regressions cannot
      # ratchet "previous" upward unnoticed).
      - name: Snapshot main's and the last release's committed results
        env:
          SUITES: ${{ inputs.suites }}
        run: |
          mkdir -p /tmp/benchmark-previous /tmp/benchmark-release
          TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' origin/main 2>/dev/null || true)
          printf '%s\n' "$SUITES" | while IFS='|' read -r label dir _history; do
            [ -z "$label" ] && continue
            safe=$(printf '%s' "$dir" | tr '/' '_')
            git show "origin/main:${dir}/results.json" > "/tmp/benchmark-previous/${safe}.json" 2>/dev/null || echo '{}' > "/tmp/benchmark-previous/${safe}.json"
            if [ -n "$TAG" ]; then
              git show "${TAG}:${dir}/results.json" > "/tmp/benchmark-release/${safe}.json" 2>/dev/null || echo '{}' > "/tmp/benchmark-release/${safe}.json"
            else
              echo '{}' > "/tmp/benchmark-release/${safe}.json"
            fi
          done

      - name: Run the benchmarks
        env:
          BENCHMARK_COMMAND: ${{ inputs.benchmark-command }}
        run: bash -c "$BENCHMARK_COMMAND"

      - name: Collect result files for upload
        env:
          SUITES: ${{ inputs.suites }}
        run: |
          mkdir -p /tmp/benchmark-artifacts
          printf '%s\n' "$SUITES" | while IFS='|' read -r label dir _history; do
            [ -z "$label" ] && continue
            safe=$(printf '%s' "$dir" | tr '/' '_')
            cp "${dir}/results.json" "/tmp/benchmark-artifacts/${safe}.results.json"
            cp "${dir}/BENCHMARKS.md" "/tmp/benchmark-artifacts/${safe}.BENCHMARKS.md"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results
          path: /tmp/benchmark-artifacts
          retention-days: 14

      # Renders the summary and evaluates the gates. The comment is posted whatever the gates say; the
      # job is failed afterwards, so a red gate is a red check AND an explained one.
      - name: Render the summary
        id: summary
        env:
          SUITES: ${{ inputs.suites }}
          BUDGETS_PATH: ${{ inputs.budgets-path }}
          COMMENT_MARKER: ${{ inputs.comment-marker }}
        run: |
          args=()
          while IFS='|' read -r label dir history; do
            [ -z "$label" ] && continue
            safe=$(printf '%s' "$dir" | tr '/' '_')
            args+=(--example "${label} (\`${dir}\`)|/tmp/benchmark-previous/${safe}.json|${dir}/results.json|${history}|/tmp/benchmark-release/${safe}.json")
          done <<< "$SUITES"
          status=0
          node node_modules/internal-package-contract/scripts/benchmark/render-summary.mjs \
            --budgets "$BUDGETS_PATH" \
            --marker "$COMMENT_MARKER" \
            --gate \
            "${args[@]}" > /tmp/summary.md || status=$?
          echo "gate-status=$status" >> "$GITHUB_OUTPUT"

      - name: Post or update the marker-tagged summary comment
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_MARKER: ${{ inputs.comment-marker }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          EXISTING=$(gh api "repos/${REPO}/issues/${PR}/comments" --jq ".[] | select(.body | startswith(\"$COMMENT_MARKER\")) | .id" | head -n1)
          if [ -n "$EXISTING" ]; then
            gh api "repos/${REPO}/issues/comments/${EXISTING}" -X PATCH -F body=@/tmp/summary.md
          else
            gh api "repos/${REPO}/issues/${PR}/comments" -X POST -F body=@/tmp/summary.md
          fi

      - name: Fail the run if a gate failed
        if: steps.summary.outputs.gate-status != '0'
        run: |
          echo "::error::A benchmark gate failed -- see the pull request comment for which, and why."
          exit 1
