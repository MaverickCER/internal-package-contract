# Reusable GitHub Pages deploy for internal-package-contract consumers, modeled on
# data-cap/env-cap's own inline `badges`/`deploy` jobs (their ci.yml, pre-migration).
# Modern artifact-based flow (actions/deploy-pages): everything is built fresh on
# every push to main and nothing is ever committed back to the repo, unlike the
# legacy "deploy from a branch" setting repo-contract used before this plan.
#
# `on: workflow_call` only -- see release-npm-changesets.yml's own identical note for
# why.
name: Deploy Pages (reusable)

on:
  workflow_call:
    inputs:
      docs-script:
        description: >-
          npm script that (re)generates the browsable HTML API reference into
          docs/api (e.g. `docs:api` for data-cap/env-cap, `api-docs:html` for
          repo-contract). Run fresh on every deploy -- never committed.
        required: true
        type: string
      badges-script:
        description: >-
          Shell command, run before the docs-script above, that regenerates badge
          JSON directly into docs/ (e.g. data-cap/env-cap's own coverage/size run
          plus `node scripts/generate-badges.mjs`). Leave empty when the caller's
          own workflow already generated this content and hands it over via
          content-artifact-name instead -- repo-contract's case, whose badge JSON
          depends on the same mutation report its own `contract` job already paid
          for, which this job must never re-run just to produce a badge.
        required: false
        type: string
        default: ""
      content-artifact-name:
        description: >-
          Name of an artifact, uploaded earlier in the SAME calling workflow run,
          to download straight into docs/ before deploying (e.g. repo-contract's
          pre-generated badge JSON and OpenSSF Scorecard/ISO 12207 evidence docs).
          Leave empty when badges-script alone covers everything.
        required: false
        type: string
        default: ""
      node-version:
        required: false
        type: string
        default: "22"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify site entry point exists
        run: test -f docs/index.html

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - run: npm ci

      - name: Regenerate badge JSON
        if: inputs.badges-script != ''
        run: ${{ inputs.badges-script }}

      - name: Download pre-generated Pages content
        if: inputs.content-artifact-name != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.content-artifact-name }}
          path: docs

      # docs/api/ is generated fresh here, every run, never committed -- the
      # Markdown report drift check in each consumer's own `contract`/`lint` job is
      # what guards the API surface's freshness on every PR regardless.
      - name: Regenerate the HTML API reference
        run: npm run ${{ inputs.docs-script }}

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
